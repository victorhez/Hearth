<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearth · language glimpse</title>
<link rel="stylesheet" href="video.css">
<style>
.wrap{width:min(1500px,88vw)}
.name{font-weight:200;font-size:min(7vw,120px);letter-spacing:.08em;opacity:0}
.q,.a{margin-top:3.5vh;font-size:min(2.6vw,44px);line-height:1.35;opacity:0;min-height:1.4em}
.q{color:var(--cyan);font-style:italic;font-family:Georgia,serif}.a{font-weight:300;color:var(--ink)}
.on{animation:in .8s ease forwards}@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.dots{position:fixed;bottom:5vh;left:50%;transform:translateX(-50%);display:flex;gap:14px}
.dots i{width:12px;height:12px;border-radius:50%;background:#333;transition:.4s}.dots i.on{background:var(--amber);box-shadow:0 0 16px var(--amber);animation:none;opacity:1;transform:scale(1.3)}
#start{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;cursor:pointer;letter-spacing:.3em;color:var(--amber);font-size:20px}
</style></head><body>
<canvas class="bg" id="c"></canvas>
<div class="stage"><div class="wrap"><div class="name" id="name"></div><div class="q" id="q"></div><div class="a" id="a"></div></div></div>
<div class="dots" id="dots"></div><div id="start">CLICK TO START THE LANGUAGE GLIMPSE</div>
<div class="hint">same page, 7 languages, live replies and voices &nbsp; ?rec=1 hides this hint &nbsp; ?only=zh for a single language</div>
<script type="module">
import { Hearth } from "../orb.js";
import { Voice } from "../voice.js";
import { session } from "../session.js";
import { SCRIPT } from "../kitchen-script.js";
const $ = (id) => document.getElementById(id), qs = new URLSearchParams(location.search), sleep = (ms) => new Promise((r) => setTimeout(r, ms));
if (qs.get("rec")) document.body.classList.add("rec");
const { headers, token } = await session({ mode: "kitchen" });
const orb = new Hearth($("c")), voice = new Voice(); orb.awake = true; orb.set("idle");
const NAMES = { en: "English", es: "Español", fr: "Français", zh: "中文", pt: "Português", de: "Deutsch", hi: "हिन्दी" };
// the "quick question" for each language (all answered from that language's seeded family archive)
const ASK = { en: SCRIPT.en.ask, es: SCRIPT.es.ask, fr: SCRIPT.fr.ask, zh: SCRIPT.zh.ask, pt: SCRIPT.pt.ask, de: SCRIPT.de.ask, hi: SCRIPT.hi.ask };
const langs = qs.get("only") ? [qs.get("only")] : Object.keys(NAMES);
langs.forEach(() => $("dots").append(document.createElement("i")));
setInterval(() => orb.setLevel(voice.speaking ? Math.max(voice.outLevel(), 0.1) + 0.08 : 0.04), 50);
const show = (el, t) => { el.classList.remove("on"); void el.offsetWidth; el.textContent = t; el.classList.add("on"); };
async function run() {
  $("start").remove();
  for (const [i, l] of langs.entries()) {
    [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === i));
    await fetch("/api/demo/reset?lang=" + (l === "en" ? "" : l), { method: "POST", headers });
    show($("name"), NAMES[l]); $("q").classList.remove("on"); $("a").classList.remove("on"); $("q").textContent = $("a").textContent = "";
    await sleep(900); show($("q"), "“" + ASK[l].replace(/^Hey Hearth[,，]?\s*/i, "") + "”"); await sleep(1300);
    orb.set("thinking");
    const out = await fetch("/api/say", { method: "POST", headers, body: JSON.stringify({ session: "lang-" + l, utterance: ASK[l], teller: "Maya", lang: l }) }).then((r) => r.json());
    const sentence = (out.reply.match(/^.*?[.。!！?？](?:\s|$)/) || [out.reply])[0].trim(); // a glimpse: just the first sentence
    show($("a"), sentence); orb.set("speaking");
    await voice.speak(sentence, "hearth", { lang: l, token });
    orb.set("idle"); await sleep(1100);
  }
  show($("name"), langs.length > 1 ? "Seven languages. One family." : NAMES[langs[0]]); $("q").textContent = $("a").textContent = "";
}
$("start").onclick = () => run();
if (qs.get("auto")) run();
</script></body></html>
